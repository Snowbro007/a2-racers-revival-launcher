name: Publish game-free portable beta

on:
  # A version bump on main publishes that version automatically, after the
  # same documentation check, full synthetic test suite and ZIP audit.
  # Pushes that do not change VERSION.txt never start a release.
  push:
    branches: [main]
    paths: [VERSION.txt]
  workflow_dispatch:
    inputs:
      version:
        description: Version from VERSION.txt (without v)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-game-free-portable-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Snowbro007/a2-racers-revival-launcher' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate version and refuse replacing a release
        id: version
        shell: pwsh
        run: |
          $checkedIn = (Get-Content VERSION.txt -Raw).Trim()
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $checkedIn }
          if ($version -notmatch '^\d+\.\d+\.\d+(-beta\.\d+)?$' -or $checkedIn -cne $version) {
            throw 'Version does not match the checked-in version.'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $tag = 'v'+$version
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          $tagState = $LASTEXITCODE
          if ($tagState -ne 0 -and $tagState -ne 2) { throw 'Unable to check remote tag.' }
          if ($releaseExists -or $tagState -eq 0) {
            # Manual runs must never replace a release; an automatic run for an
            # already published version simply has nothing to do.
            if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { throw 'Release or tag already exists.' }
            "publish=false" >> $env:GITHUB_OUTPUT
            "Version $version is already published; nothing to do."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          # A missing tag is the expected git exit code 2. GitHub's PowerShell
          # wrapper otherwise carries that status into a failed job step.
          exit 0
      - name: Validate source and run synthetic tests
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          python tools/check_public_docs.py
          if ($LASTEXITCODE -ne 0) { throw 'Public documentation check failed.' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic tests failed.' }
      - name: Build and audit code-only portable ZIP
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $zip = 'dist/A2-Racers-Revival-'+$env:RELEASE_VERSION+'-Windows-x64.zip'
          python -B tools/portable_launcher.py build --public --output $zip
          if ($LASTEXITCODE -ne 0) { throw 'Public ZIP build failed.' }
          python -B tools/portable_launcher.py audit --archive $zip
          if ($LASTEXITCODE -ne 0) { throw 'Public ZIP audit failed.' }
          python -B tools/check_public_release.py --archive $zip --version $env:RELEASE_VERSION --notes-template docs/public-release-notes.md --notes-output dist/portable-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Game-free ZIP check failed.' }
      - name: Publish only the audited portable ZIP and checksum
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $zip = 'dist/A2-Racers-Revival-'+$env:RELEASE_VERSION+'-Windows-x64.zip'
          # The launcher updater accepts exactly this ZIP plus its .sha256 file.
          # One explicit flag value; splatting a one-item if-result passed it letter by letter.
          $prerelease = if ($env:RELEASE_VERSION -like '*-beta.*') { 'true' } else { 'false' }
          gh release create ('v'+$env:RELEASE_VERSION) $zip ($zip+'.sha256') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ('A2 Racers Revival '+$env:RELEASE_VERSION) --notes-file dist/portable-release-notes.md ("--prerelease=" + $prerelease)
          if ($LASTEXITCODE -ne 0) { throw 'Portable release upload failed.' }
